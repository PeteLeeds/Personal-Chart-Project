<p>Number of songs: {{songCount}}</p>
<search [type]="'song'" (changeEvent)="setParams($event)"></search>
<div>
  <b>Sort By:</b>
  <select [(ngModel)]="sortBy" (change)="reloadSongs()">
    @for (option of sortOptions; track option) {
      <option>{{option}}</option>
    }
  </select>
</div>
<div class="row">
  @if (pageNumber > 1) {
    <div class="button" (click)="decPageNumber()">Previous Page</div>
  }
  @if (songCount && songCount > pageNumber * 20) {
    <div class="button" (click)="incPageNumber()">Next Page</div>
  }
</div>

@for (song of songs; track song) {
  <a [routerLink]="['/song', song._id]">
    <div class="select-option">
      <div><b>{{song.title}}</b></div>
      <div><i>{{song.artistDisplay}}</i></div>
    </div>
  </a>
}

<p>Number of artists: {{artistCount}}</p>
<search [type]="'artist'" (changeEvent)="setParams($event)"></search>
<div class="row">
  @if (pageNumber > 1) {
    <div class="button" (click)="decPageNumber()">Previous Page</div>
  }
  @if (artistCount && artistCount > pageNumber * 20) {
    <div class="button" (click)="incPageNumber()">Next Page</div>
  }
</div>
<!--Currently no need for sort as artists only have a name-->
@for (artist of artists; track artist) {
  <a [routerLink]="['/artist', artist._id]">
    <div class="select-option">
      <p>{{artist.name}}</p>
    </div>
  </a>
}
